name: Refresh data

# Every morning (06:30 KST) pull the latest 국토부 apartment trades, rebuild web/public/data and commit it.
# A connected Vercel project redeploys on that commit.
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          TZ: Asia/Seoul
        run: python scripts/refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw web/public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh data $(date +%F)"
            git push
          fi
